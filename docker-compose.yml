services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: .
    command: ["uvicorn", "fleet_monitor.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DATABASE_PATH: /tmp/fleet.db
      OFFLINE_AFTER_SECONDS: ${OFFLINE_AFTER_SECONDS:-8}
      LOW_BATTERY_PERCENT: ${LOW_BATTERY_PERCENT:-20}
      STUCK_AFTER_SECONDS: ${STUCK_AFTER_SECONDS:-10}
    depends_on:
      - mosquitto

  simulator:
    build: .
    command: ["python", "-m", "fleet_monitor.simulator"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SIM_SCENARIO: ${SIM_SCENARIO:-healthy}
      SIM_ROBOTS: ${SIM_ROBOTS:-robot-1,robot-2,robot-3}
      SIM_INTERVAL: ${SIM_INTERVAL:-1}
    depends_on:
      - mosquitto
